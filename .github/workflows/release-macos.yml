name: Prepare macOS release

on:
  push:
    tags: ['v[0-9]*']

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'alkaline1024/earthql'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Validate the release tag
        run: |
          node -e 'const version = require("./apps/desktop/package.json").version;
            if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== "v" + version) {
              throw new Error("The release tag must match the stable version in apps/desktop/package.json.");
            }'
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Build and verify the ad-hoc Mac app
        env:
          EARTHQL_UPDATE_PUBLIC_KEY: ${{ vars.EARTHQL_UPDATE_PUBLIC_KEY }}
          EARTHQL_FEEDBACK_URL: ${{ vars.EARTHQL_FEEDBACK_URL }}
        run: |
          if [[ -z "$EARTHQL_UPDATE_PUBLIC_KEY" ]]; then
            echo '::error::Missing Actions variable EARTHQL_UPDATE_PUBLIC_KEY.'
            exit 1
          fi
          npm run dist:mac -w @earthql/desktop
          app=apps/desktop/release/mac-arm64/EarthQL.app
          codesign --verify --deep --strict "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          if [[ "$signature" != *'Signature=adhoc'* ]]; then
            echo '::error::Expected an ad-hoc macOS signature.'
            exit 1
          fi
      - name: Sign the update manifest
        env:
          EARTHQL_UPDATE_PUBLIC_KEY: ${{ vars.EARTHQL_UPDATE_PUBLIC_KEY }}
          EARTHQL_UPDATE_PRIVATE_KEY: ${{ secrets.EARTHQL_UPDATE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/sign-update.mjs "$version" "apps/desktop/release/EarthQL-$version-arm64-mac.zip"
      - name: Create the draft release
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --title "EarthQL $version" "EarthQL-$version-arm64-mac.dmg" "EarthQL-$version-arm64-mac.zip" earthql-update.json
