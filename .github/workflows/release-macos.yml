name: Prepare macOS release

on:
  push:
    tags: ['v[0-9]*']

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'alkaline1024/earthql'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Validate the release tag
        run: |
          node -e 'const version = require("./apps/desktop/package.json").version;
            if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== "v" + version) {
              throw new Error("The release tag must match the stable version in apps/desktop/package.json.");
            }'
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Build and verify the signed Mac app
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EARTHQL_FEEDBACK_URL: ${{ vars.EARTHQL_FEEDBACK_URL }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing macOS release credential: $name"
              exit 1
            fi
          done
          npm run dist:mac -w @earthql/desktop -- --config.forceCodeSigning=true --config.mac.notarize=true
          app=apps/desktop/release/mac-arm64/EarthQL.app
          codesign --verify --deep --strict "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          if [[ "$signature" != *'Authority=Developer ID Application:'* ]]; then
            echo '::error::Expected a Developer ID Application signature.'
            exit 1
          fi
          xcrun stapler validate "$app"
      - name: Create the draft release
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          installers=(*.dmg)
          archives=(*.zip)
          if [[ ${#installers[@]} -ne 1 || ${#archives[@]} -ne 1 || ! -s latest-mac.yml ]]; then
            echo '::error::Expected a DMG, an update ZIP, and latest-mac.yml.'
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --title "EarthQL ${GITHUB_REF_NAME#v}" "${installers[@]}" "${archives[@]}" latest-mac.yml *.blockmap
