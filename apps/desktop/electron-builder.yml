appId: com.earthql.app
productName: EarthQL
publish:
  provider: github
  owner: alkaline1024
  repo: earthql
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "12.0"
  target:
    - target: dmg
    - target: zip
  # The release workflow requires Developer ID signing and verifies the notarization ticket.
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  title: EarthQL
electronVersion: "39.8.10"
