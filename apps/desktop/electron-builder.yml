appId: com.earthql.app
productName: EarthQL
artifactName: "${productName}-${version}-${arch}-mac.${ext}"
extraResources:
  - from: build/install-update.sh
    to: install-update.sh
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "12.0"
  target:
    - target: dmg
    - target: zip
  identity: "-"
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: EarthQL
electronVersion: "39.8.10"
